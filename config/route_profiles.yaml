profiles:
  safe:
    id: safe
    name: Safe Route (Low Risk and Maximum Reserve)
    risk_weight: 6.0
    slope_weight: 5.0
    max_slope_deg: 20.0
    caution_slope_deg: 8.0
    min_traversability: 0.0
    science_reward_weight: 0.5
    speed_factor: 0.85
    min_reserve_pct: 25.0
    description: >
      Prioritizes the explorer's physical integrity and the safety margin of the EVA suits.
      Avoids steep slopes and low-traversability terrain. Requires at least 25%
      oxygen and battery reserve on arrival at the shelter.

  fast:
    id: fast
    name: Fast Route (Minimum EVA Time and Distance)
    risk_weight: 1.5
    slope_weight: 1.5
    max_slope_deg: 22.0
    caution_slope_deg: 10.0
    min_traversability: 0.0
    science_reward_weight: 0.0
    speed_factor: 1.15
    min_reserve_pct: 15.0
    description: >
      Minimizes environmental exposure time by following the fastest geometric corridor.
      Accepts slopes of up to 22° if the walking kinematics allow it.

  scientific:
    id: scientific
    name: Scientific Route (Maximum Return of Samples and Findings)
    risk_weight: 3.5
    slope_weight: 3.0
    max_slope_deg: 20.0
    caution_slope_deg: 8.0
    min_traversability: 0.0
    science_reward_weight: 4.0
    speed_factor: 0.95
    min_reserve_pct: 20.0
    description: >
      Diverts the trajectory toward areas with CRISM spectral footprints, hydrated minerals
      or sedimentary deposits of high geological value, while keeping the obligation to end
      at a safe shelter with a minimum 20% reserve.

hard_constraints:
  require_final_shelter: true
  max_eva_hours: 8.0
  max_radiation_dose_msv: 5.0
  min_oxygen_reserve_pct: 15.0
  min_battery_reserve_pct: 15.0
  max_wind_speed_ms: 25.0
  max_dust_opacity_tau: 1.8
